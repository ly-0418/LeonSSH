[package]
name = "leonssh"
version = "0.4.1"
description = "LeonSSH - a Windows-first visual SSH client"
authors = ["LeonSSH"]
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "leonssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Builds the bundled russh test server used for phase-2 acceptance:
#   cargo run --features test-server --bin ssh-test-server
# It is *not* part of the shipped application.
test-server = []

[[bin]]
name = "ssh-test-server"
path = "src/bin/ssh_test_server.rs"
required-features = ["test-server"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "fs"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
bytes = "1"
# Pure-Rust SSH. `ring` is used instead of the default `aws-lc-rs` backend:
# aws-lc-rs needs CMake/NASM on Windows, ring builds with the MSVC toolchain
# that Tauri already requires.
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
# Phase 4: SFTP over the same SSH connection (works with russh 0.63.x).
russh-sftp = "3"
# Phase A (file manager): local filesystem access from the frontend.
tauri-plugin-fs = "2"
# Phase 3: local persistence. tauri-plugin-sql wraps sqlx/SQLite.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Same sqlx version the plugin links, so both share one connection type.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
# Phase 3: passwords live in the Windows Credential Manager, never in SQLite.
keyring = "4"

# Windows shell integration: open a local file with its default application.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

# Read the optimization guideline for more details:
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true

[profile.dev]
# Keep debug builds reasonably fast to link (Tauri is a large dependency graph).
debug = 1





# Streaming directory listings: the upstream crate hides its per-batch READDIR.
[patch.crates-io]
russh-sftp = { path = "vendor/russh-sftp" }
