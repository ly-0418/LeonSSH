[package]
name = "leonssh"
version = "0.1.0"
description = "LeonSSH - a Windows-first visual SSH client"
authors = ["LeonSSH"]
edition = "2024"
rust-version = "1.89"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "leonssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Builds the bundled russh test server used for phase-2 acceptance:
#   cargo run --features test-server --bin ssh-test-server
# It is *not* part of the shipped application.
test-server = []

[[bin]]
name = "ssh-test-server"
path = "src/bin/ssh_test_server.rs"
required-features = ["test-server"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
bytes = "1"
# Pure-Rust SSH. `ring` is used instead of the default `aws-lc-rs` backend:
# aws-lc-rs needs CMake/NASM on Windows, ring builds with the MSVC toolchain
# that Tauri already requires.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

# Read the optimization guideline for more details:
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true

[profile.dev]
# Keep debug builds reasonably fast to link (Tauri is a large dependency graph).
debug = 1
